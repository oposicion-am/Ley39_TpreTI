<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Ley 39/2015 · Título preliminar y Título I</title>
<style>
:root{--verde:#2f6b3a;--verde2:#e8f1e9;--tinta:#1f2a24;--gris:#6b7770;--borde:#d5ddd7;--ok:#1f7a3a;--okbg:#e4f4e8;--ko:#b3261e;--kobg:#fbe9e7;--fondo:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--tinta);line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 40px}
header h1{font-size:1.25rem;margin:0 0 4px;color:var(--verde)}
header p{margin:0;color:var(--gris);font-size:.92rem}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:.88rem;color:var(--gris)}
.bar{flex:1;height:8px;background:#dfe6e1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--gris)}
.tag{padding:2px 9px;border-radius:20px;background:var(--verde2);color:var(--verde);font-weight:bold;font-size:.78rem}
.q{font-size:1.06rem;font-weight:bold;margin:0 0 16px;text-align:justify}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--borde);border-radius:9px;padding:11px 13px;margin:0 0 9px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--verde);background:#f7fbf8}
.opt b{min-width:20px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.why{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:.93rem;text-align:justify;display:none}
.why.ok{display:block;background:var(--okbg);border-left:4px solid var(--ok)}
.why.ko{display:block;background:var(--kobg);border-left:4px solid var(--ko)}
.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center}
.big{font-size:3rem;font-weight:bold;color:var(--verde);margin:6px 0}
.result ul{text-align:left;padding-left:18px}
.result li{margin-bottom:8px;text-align:justify}
footer{margin-top:34px;text-align:center;font-size:.8rem;color:var(--gris)}
footer a{color:var(--gris);text-decoration:underline;cursor:pointer}
#lock{display:none;margin-top:12px}
#lock input{padding:8px 10px;border:1px solid var(--borde);border-radius:7px;font:inherit;width:200px}
#lockmsg{color:var(--ko);font-size:.85rem;min-height:1.2em;margin-top:6px}
#word{display:none}
#wordbody{background:#fff;border:1px solid var(--borde);padding:28px 34px;font-family:Arial;font-size:11pt}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  #wordbody{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="quiz">
    <header class="noprint">
      <h1>TEST DE EVALUACIÓN - Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas: Título preliminar y Título I</h1>
      <p>49 preguntas · una sola respuesta correcta · corrección inmediata</p>
    </header>
    <div class="prog noprint"><span id="cnt">1 / 49</span><div class="bar"><i id="barfill"></i></div><span id="score">0 aciertos</span></div>
    <div class="card" id="stage"></div>
  </div>

  <div id="word">
    <div class="actions noprint" style="justify-content:flex-start;margin-bottom:14px">
      <button class="btn" onclick="copyWord()">Copiar para Word</button>
      <button class="btn" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="downloadDoc()">Descargar .doc</button>
      <button class="btn sec" onclick="closeWord()">Volver al test</button>
      <span id="copymsg" style="align-self:center;font-size:.85rem;color:var(--ok)"></span>
    </div>
    <div id="wordbody"></div>
  </div>

  <footer class="noprint" id="foot">
    <a onclick="toggleLock()">Acceso docente</a>
    <div id="lock">
      <input type="password" id="pw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn" style="padding:8px 14px" onclick="unlock()">Entrar</button>
      <div id="lockmsg"></div>
    </div>
  </footer>
</div>

<script>
const DATA = [{"d": "Fácil", "q": "Según el artículo 1 de la Ley 39/2015, la Ley tiene por objeto regular, entre otras materias:", "o": ["Los requisitos de validez y eficacia de los actos administrativos y el procedimiento administrativo común a todas las Administraciones Públicas, incluyendo el sancionador y el de reclamación de responsabilidad.", "El régimen estatutario de los funcionarios que tramitan los procedimientos administrativos.", "La organización y el funcionamiento interno de los órganos del sector público institucional.", "El procedimiento contencioso-administrativo para la impugnación de los actos de las Administraciones Públicas."], "c": 0, "w": "Art. 1.1: la Ley regula los requisitos de validez y eficacia de los actos administrativos y el procedimiento administrativo común a todas las Administraciones Públicas, incluidos el sancionador y el de reclamación de responsabilidad, así como los principios de la iniciativa legislativa y la potestad reglamentaria."}, {"d": "Fácil", "q": "El artículo 1.1 incluye también en el objeto de la Ley los principios a los que se ha de ajustar el ejercicio de:", "o": ["La potestad sancionadora y la potestad expropiatoria.", "La iniciativa legislativa y la potestad reglamentaria.", "La revisión de oficio y los recursos administrativos.", "La contratación pública y la potestad tributaria."], "c": 1, "w": "Art. 1.1 in fine: el objeto de la Ley comprende «los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria»."}, {"d": "Medio", "q": "Según el artículo 1.2, podrán incluirse trámites adicionales o distintos a los contemplados en la Ley 39/2015:", "o": ["Mediante real decreto del Consejo de Ministros, previo dictamen del Consejo de Estado.", "Mediante orden de la consejería competente por razón de la materia, cuando lo exija la naturaleza del procedimiento.", "Mediante ley o reglamento, siempre que se justifique en la memoria de análisis de impacto normativo.", "Solo mediante ley, cuando resulte eficaz, proporcionado y necesario para la consecución de los fines propios del procedimiento, y de manera motivada."], "c": 3, "w": "Art. 1.2: «Solo mediante ley, cuando resulte eficaz, proporcionado y necesario para la consecución de los fines propios del procedimiento, y de manera motivada, podrán incluirse trámites adicionales o distintos»."}, {"d": "Difícil", "q": "De acuerdo con el artículo 1.2, ¿cuál de las siguientes especialidades del procedimiento puede establecerse reglamentariamente?", "o": ["Trámites adicionales a los previstos en la Ley.", "Supuestos de nulidad de pleno derecho no previstos en la Ley.", "Las formas de iniciación y terminación del concreto procedimiento.", "Requisitos de validez de los actos administrativos distintos de los legales."], "c": 2, "w": "Art. 1.2: reglamentariamente pueden establecerse especialidades referidas a los órganos competentes, plazos propios del procedimiento por razón de la materia, formas de iniciación y terminación, publicación e informes a recabar. Los trámites adicionales o distintos exigen ley."}, {"d": "Fácil", "q": "Según el artículo 2.1, el sector público al que se aplica la Ley comprende:", "o": ["La Administración General del Estado, las Comunidades Autónomas y las Entidades Locales, con exclusión del sector público institucional.", "La Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local y el sector público institucional.", "Únicamente las Administraciones territoriales y sus organismos autónomos.", "La Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades Locales y las Corporaciones de Derecho Público."], "c": 1, "w": "Art. 2.1: la Ley se aplica al sector público, que comprende a) la AGE, b) las Administraciones de las CCAA, c) las Entidades que integran la Administración Local y d) el sector público institucional."}, {"d": "Medio", "q": "Según el artículo 2.2, el sector público institucional se integra por:", "o": ["Los organismos públicos y entidades de derecho público vinculados o dependientes de las Administraciones Públicas, las entidades de derecho privado vinculadas o dependientes de ellas y las Universidades públicas.", "Los organismos públicos vinculados a las Administraciones Públicas y las Corporaciones de Derecho Público.", "Exclusivamente los organismos autónomos y las entidades públicas empresariales.", "Las entidades de derecho privado vinculadas a las Administraciones Públicas, las Corporaciones de Derecho Público y las Universidades públicas y privadas."], "c": 0, "w": "Art. 2.2: el sector público institucional lo integran a) organismos públicos y entidades de derecho público vinculados o dependientes, b) entidades de derecho privado vinculadas o dependientes y c) Universidades públicas. Las Corporaciones de Derecho Público se tratan aparte en el art. 2.4."}, {"d": "Medio", "q": "Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas quedan sujetas a la Ley 39/2015:", "o": ["Solo de forma supletoria respecto de su normativa específica.", "En lo dispuesto en las normas de la Ley que específicamente se refieran a ellas y, en todo caso, cuando ejerzan potestades administrativas.", "Íntegramente, al tener la consideración de Administraciones Públicas.", "En ningún caso, al regirse exclusivamente por el Derecho privado."], "c": 1, "w": "Art. 2.2.b): quedan sujetas a lo dispuesto en las normas de la Ley que específicamente se refieran a ellas y, en todo caso, cuando ejerzan potestades administrativas."}, {"d": "Fácil", "q": "Las Universidades públicas se rigen:", "o": ["Por su normativa específica y supletoriamente por las previsiones de la Ley 39/2015.", "Íntegramente por la Ley 39/2015 al tener la consideración de Administración Pública.", "Por la Ley 39/2015 y supletoriamente por su normativa específica.", "Exclusivamente por su normativa específica, sin aplicación de la Ley 39/2015."], "c": 0, "w": "Art. 2.2.c): las Universidades públicas se regirán por su normativa específica y supletoriamente por las previsiones de esta Ley."}, {"d": "Difícil", "q": "Según el artículo 2.3, tienen la consideración de Administraciones Públicas, además de las Administraciones territoriales:", "o": ["Los grupos de afectados y las uniones sin personalidad jurídica, cuando la Ley lo declare expresamente.", "Las Corporaciones de Derecho Público cuando ejerzan funciones públicas delegadas.", "Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas.", "Los organismos públicos y entidades de derecho público vinculados o dependientes de las Administraciones Públicas."], "c": 3, "w": "Art. 2.3: son Administraciones Públicas la AGE, las Administraciones de las CCAA, las Entidades de la Administración Local y los organismos públicos y entidades de derecho público de la letra a) del art. 2.2. No lo son las entidades de derecho privado ni las Universidades públicas."}, {"d": "Difícil", "q": "¿Cuál de las siguientes NO tiene la consideración de Administración Pública conforme al artículo 2.3?", "o": ["Una Diputación Provincial, como entidad de la Administración Local.", "Un organismo autónomo dependiente de una Comunidad Autónoma.", "La Administración de la Comunidad de Castilla y León.", "Una Universidad pública."], "c": 3, "w": "Art. 2.3 en relación con el art. 2.2: las Universidades públicas forman parte del sector público institucional (art. 2.2.c), pero el art. 2.3 solo atribuye la condición de Administración Pública a las territoriales y a los organismos públicos y entidades de derecho público de la letra a)."}, {"d": "Medio", "q": "Las Corporaciones de Derecho Público, según el artículo 2.4:", "o": ["Tienen la consideración de Administraciones Públicas a todos los efectos.", "Forman parte del sector público institucional y se rigen íntegramente por la Ley 39/2015.", "Se rigen por su normativa específica en el ejercicio de las funciones públicas atribuidas por Ley o delegadas por una Administración Pública, y supletoriamente por la Ley 39/2015.", "Quedan excluidas en todo caso del ámbito de aplicación de la Ley 39/2015."], "c": 2, "w": "Art. 2.4: las Corporaciones de Derecho Público se regirán por su normativa específica en el ejercicio de las funciones públicas atribuidas por Ley o delegadas por una Administración Pública, y supletoriamente por la presente Ley."}, {"d": "Fácil", "q": "Tienen capacidad de obrar ante las Administraciones Públicas las personas físicas o jurídicas que la ostenten con arreglo a:", "o": ["Las normas mercantiles.", "Las normas administrativas.", "Las normas procesales.", "Las normas civiles."], "c": 3, "w": "Art. 3.a): tienen capacidad de obrar las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a las normas civiles."}, {"d": "Medio", "q": "Los menores de edad tienen capacidad de obrar ante las Administraciones Públicas:", "o": ["Siempre que actúen asistidos por la persona que ejerza la patria potestad, tutela o curatela.", "Solo a partir de los dieciséis años y para cualquier procedimiento.", "En ningún caso, debiendo actuar siempre a través de su representante legal.", "Para el ejercicio y defensa de aquellos derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela."], "c": 3, "w": "Art. 3.b): los menores de edad tienen capacidad de obrar para el ejercicio y defensa de los derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela."}, {"d": "Difícil", "q": "Respecto de la capacidad de obrar de los menores de edad del artículo 3.b), se exceptúa el supuesto de:", "o": ["Los menores de catorce años, en todo caso.", "Los menores emancipados, que actúan siempre mediante representante.", "Los menores que no dispongan de certificado electrónico propio.", "Los menores incapacitados, cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate."], "c": 3, "w": "Art. 3.b) in fine: «Se exceptúa el supuesto de los menores incapacitados, cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate»."}, {"d": "Medio", "q": "Los grupos de afectados, las uniones y entidades sin personalidad jurídica y los patrimonios independientes o autónomos tienen capacidad de obrar ante las Administraciones Públicas:", "o": ["Cuando lo autorice el órgano competente para resolver el procedimiento.", "En todo caso, por defender intereses colectivos.", "Cuando la Ley así lo declare expresamente.", "Cuando estén inscritos en el registro electrónico de apoderamientos."], "c": 2, "w": "Art. 3.c): tienen capacidad de obrar, cuando la Ley así lo declare expresamente, los grupos de afectados, las uniones y entidades sin personalidad jurídica y los patrimonios independientes o autónomos."}, {"d": "Fácil", "q": "Según el artículo 4.1.a), se consideran interesados quienes promuevan el procedimiento como titulares de:", "o": ["Un simple interés en la legalidad, mediante acción pública.", "Derechos o intereses legítimos individuales o colectivos.", "Derechos subjetivos exclusivamente individuales.", "Intereses económicos directos y cuantificables."], "c": 1, "w": "Art. 4.1.a): son interesados quienes promuevan el procedimiento como titulares de derechos o intereses legítimos individuales o colectivos."}, {"d": "Difícil", "q": "Una persona que no ha iniciado el procedimiento, pero cuyos intereses legítimos pueden resultar afectados por la resolución, tendrá la condición de interesada:", "o": ["Solo si se persona antes de que se abra el trámite de audiencia.", "Solo si la Administración le notifica expresamente el inicio del procedimiento.", "Si se persona en el procedimiento en tanto no haya recaído resolución definitiva.", "En todo caso, sin necesidad de personarse."], "c": 2, "w": "Art. 4.1.c): son interesados aquellos cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución y se personen en el procedimiento en tanto no haya recaído resolución definitiva."}, {"d": "Difícil", "q": "Quien, sin haber iniciado el procedimiento, tenga DERECHOS que puedan resultar afectados por la decisión que en el mismo se adopte:", "o": ["Solo será interesado si se persona antes de la resolución definitiva.", "Es interesado, sin que la Ley le exija personarse para ostentar esa condición.", "Solo será interesado si lo solicita por escrito y lo admite el instructor.", "No tiene la condición de interesado por no haber promovido el procedimiento."], "c": 1, "w": "Art. 4.1.b): son interesados los que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la decisión. A diferencia de la letra c), referida a intereses legítimos, no se exige la personación."}, {"d": "Medio", "q": "Las asociaciones y organizaciones representativas de intereses económicos y sociales son, según el artículo 4.2:", "o": ["Titulares de los derechos subjetivos individuales de cada uno de sus asociados.", "Titulares de intereses legítimos colectivos en los términos que la Ley reconozca.", "Representantes legales de sus asociados sin necesidad de acreditar la representación.", "Interesadas en todo procedimiento que afecte al sector que representan, sin limitación."], "c": 1, "w": "Art. 4.2: las asociaciones y organizaciones representativas de intereses económicos y sociales serán titulares de intereses legítimos colectivos en los términos que la Ley reconozca."}, {"d": "Medio", "q": "Cuando la condición de interesado derive de alguna relación jurídica transmisible:", "o": ["El derecho-habiente sucederá en tal condición cualquiera que sea el estado del procedimiento.", "La sucesión requerirá autorización previa del órgano instructor.", "El derecho-habiente solo sucederá si no se ha abierto aún el trámite de audiencia.", "Se archivará el procedimiento y el derecho-habiente deberá iniciar uno nuevo."], "c": 0, "w": "Art. 4.3: cuando la condición de interesado derivase de alguna relación jurídica transmisible, el derecho-habiente sucederá en tal condición cualquiera que sea el estado del procedimiento."}, {"d": "Fácil", "q": "Cuando un interesado actúa por medio de representante, las actuaciones administrativas se entenderán:", "o": ["Indistintamente con el interesado o con el representante, a elección del órgano.", "Siempre con el interesado, informando al representante.", "Con el representante, salvo manifestación expresa en contra del interesado.", "Con el representante solo si este acredita la representación ante notario."], "c": 2, "w": "Art. 5.1: los interesados con capacidad de obrar podrán actuar por medio de representante, entendiéndose con éste las actuaciones administrativas, salvo manifestación expresa en contra del interesado."}, {"d": "Medio", "q": "Según el artículo 5.2, pueden actuar en representación de otras personas ante las Administraciones Públicas:", "o": ["Las personas físicas con capacidad de obrar y las personas jurídicas, siempre que ello esté previsto en sus Estatutos.", "Las personas físicas mayores de edad, con exclusión de las personas jurídicas.", "Únicamente los abogados, procuradores y gestores administrativos colegiados.", "Las personas jurídicas en todo caso y las personas físicas inscritas en el registro de apoderamientos."], "c": 0, "w": "Art. 5.2: las personas físicas con capacidad de obrar y las personas jurídicas, siempre que ello esté previsto en sus Estatutos, podrán actuar en representación de otras ante las Administraciones Públicas."}, {"d": "Fácil", "q": "¿En cuál de los siguientes casos NO es necesario acreditar la representación, al presumirse?", "o": ["Para desistir de acciones en nombre de otra persona.", "En los actos y gestiones de mero trámite.", "Para presentar declaraciones responsables en nombre de otra persona.", "Para interponer recursos en nombre de otra persona."], "c": 1, "w": "Art. 5.3: debe acreditarse la representación para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos. Para los actos y gestiones de mero trámite se presume."}, {"d": "Medio", "q": "A efectos del artículo 5.4, se entiende acreditada la representación realizada mediante:", "o": ["Exclusivamente poder otorgado ante notario.", "Autorización escrita del interesado acompañada de su certificado de empadronamiento.", "Apoderamiento apud acta efectuado por comparecencia personal o electrónica en la sede electrónica, o acreditación de su inscripción en el registro electrónico de apoderamientos.", "Declaración responsable del representante, sin necesidad de otro documento."], "c": 2, "w": "Art. 5.4: la representación puede acreditarse por cualquier medio válido en Derecho que deje constancia fidedigna; y se entiende acreditada la realizada por apoderamiento apud acta (comparecencia personal o electrónica) o mediante la inscripción en el registro electrónico de apoderamientos."}, {"d": "Difícil", "q": "El documento electrónico que acredite el resultado de la consulta al registro electrónico de apoderamientos correspondiente:", "o": ["Tiene la condición de acreditación de la representación a estos efectos.", "Solo es válido si lo expide el Registro Mercantil.", "Tiene un valor meramente informativo y exige aportar además poder notarial.", "Solo surte efectos si el interesado lo ratifica personalmente."], "c": 0, "w": "Art. 5.5: el órgano competente debe incorporar al expediente la acreditación de la condición de representante y de sus poderes; el documento electrónico que acredite el resultado de la consulta al registro electrónico de apoderamientos tiene la condición de acreditación a estos efectos."}, {"d": "Fácil", "q": "La falta o insuficiente acreditación de la representación podrá subsanarse en el plazo de:", "o": ["Quince días hábiles en todo caso.", "Diez días, o un plazo superior cuando las circunstancias del caso así lo requieran.", "Un mes desde la presentación del escrito.", "Cinco días improrrogables."], "c": 1, "w": "Art. 5.6: el defecto puede subsanarse dentro del plazo de diez días que deberá conceder el órgano administrativo, o de un plazo superior cuando las circunstancias del caso así lo requieran."}, {"d": "Medio", "q": "¿Qué efecto tiene la falta o insuficiente acreditación de la representación?", "o": ["Provoca la inadmisión inmediata del escrito sin posibilidad de subsanación.", "Supone tener al interesado por desistido sin necesidad de requerimiento previo.", "Determina la nulidad de pleno derecho del acto realizado por el representante.", "No impide que se tenga por realizado el acto, siempre que se aporte la acreditación o se subsane el defecto en el plazo concedido."], "c": 3, "w": "Art. 5.6: la falta o insuficiente acreditación no impedirá que se tenga por realizado el acto de que se trate, siempre que se aporte aquélla o se subsane el defecto en el plazo concedido."}, {"d": "Difícil", "q": "Respecto de las personas físicas o jurídicas habilitadas por las Administraciones Públicas para realizar determinadas transacciones electrónicas en representación de los interesados (art. 5.7), señale la respuesta correcta:", "o": ["Solo pueden ser habilitadas personas jurídicas y con carácter específico.", "La habilitación no determina presunción alguna de validez de la representación.", "Mientras esté vigente la habilitación, el interesado no puede comparecer por sí mismo en el procedimiento.", "Las Administraciones podrán requerir en cualquier momento la acreditación de la representación y, no obstante, siempre podrá comparecer el interesado por sí mismo."], "c": 3, "w": "Art. 5.7: la habilitación puede ser general o específica, determina la presunción de validez de la representación salvo que la normativa disponga otra cosa, las Administraciones pueden requerir la acreditación en cualquier momento y siempre podrá comparecer el interesado por sí mismo."}, {"d": "Medio", "q": "En el registro electrónico general de apoderamientos deberán inscribirse, al menos:", "o": ["Únicamente los poderes para la realización de trámites específicos ante un Organismo.", "Exclusivamente los poderes otorgados por personas jurídicas.", "Todos los poderes notariales otorgados en el territorio nacional.", "Los apoderamientos de carácter general otorgados apud acta, presencial o electrónicamente, por quien ostente la condición de interesado, a favor de un representante."], "c": 3, "w": "Art. 6.1: deberán inscribirse, al menos, los de carácter general otorgados apud acta, presencial o electrónicamente, por quien ostente la condición de interesado a favor de representante, para actuar en su nombre ante las Administraciones Públicas."}, {"d": "Difícil", "q": "Según el artículo 6.1, además del apoderamiento, en el registro electrónico general de apoderamientos deberá constar también:", "o": ["La aceptación expresa del órgano competente para resolver.", "El bastanteo realizado del poder.", "El informe jurídico del servicio de asesoría correspondiente.", "La firma manuscrita del apoderado."], "c": 1, "w": "Art. 6.1, párrafo primero in fine: «También deberá constar el bastanteo realizado del poder». En el ámbito estatal, este registro es el Registro Electrónico de Apoderamientos de la AGE."}, {"d": "Medio", "q": "Los registros electrónicos generales y particulares de apoderamientos permitirán comprobar válidamente la representación mediante la consulta a:", "o": ["El Registro Civil y el padrón municipal de habitantes.", "Exclusivamente el registro mercantil.", "Otros registros administrativos similares, al registro mercantil, de la propiedad y a los protocolos notariales.", "Los registros de la Seguridad Social y de la Agencia Tributaria."], "c": 2, "w": "Art. 6.2: los registros de apoderamientos permitirán comprobar la representación mediante la consulta a otros registros administrativos similares, al registro mercantil, de la propiedad y a los protocolos notariales, que serán interoperables con aquellos."}, {"d": "Medio", "q": "¿Cuál de los siguientes datos NO figura entre el contenido mínimo de los asientos de los registros electrónicos de apoderamientos (art. 6.3)?", "o": ["La fecha de inscripción.", "El tipo de poder según las facultades que otorgue.", "El período de tiempo por el cual se otorga el poder.", "El domicilio a efectos de notificaciones del apoderado."], "c": 3, "w": "Art. 6.3: los asientos deben contener, al menos, a) identificación del poderdante, b) identificación del apoderado, c) fecha de inscripción, d) período de tiempo por el que se otorga el poder y e) tipo de poder. El domicilio no figura."}, {"d": "Medio", "q": "¿Cuál de las siguientes NO es una de las tipologías de poder inscribibles según el artículo 6.4?", "o": ["Un poder para actuar en cualquier actuación administrativa ante una Administración u Organismo concreto.", "Un poder general para actuar en cualquier actuación administrativa y ante cualquier Administración.", "Un poder para actuar en nombre del poderdante ante los órganos jurisdiccionales del orden contencioso-administrativo.", "Un poder para la realización únicamente de determinados trámites especificados en el poder."], "c": 2, "w": "Art. 6.4: las tipologías son a) poder general ante cualquier Administración, b) poder ante una Administración u Organismo concreto y c) poder para determinados trámites especificados. La representación procesal no se regula aquí."}, {"d": "Medio", "q": "El apoderamiento apud acta se otorgará, según el artículo 6.5:", "o": ["Mediante comparecencia personal ante el órgano competente para resolver, únicamente.", "Mediante escrito remitido por correo postal certificado al órgano instructor.", "Exclusivamente ante notario o ante el secretario del ayuntamiento.", "Mediante comparecencia electrónica en la sede electrónica con los sistemas de firma previstos en la Ley, o mediante comparecencia personal en las oficinas de asistencia en materia de registros."], "c": 3, "w": "Art. 6.5: el apoderamiento apud acta se otorga mediante comparecencia electrónica en la correspondiente sede electrónica, usando los sistemas de firma electrónica de la Ley, o mediante comparecencia personal en las oficinas de asistencia en materia de registros."}, {"d": "Fácil", "q": "Los poderes inscritos en el registro electrónico de apoderamientos tienen una validez determinada máxima de:", "o": ["Cinco años a contar desde la fecha de inscripción.", "Diez años a contar desde la fecha de inscripción.", "Dos años a contar desde la fecha de otorgamiento.", "Validez indefinida hasta su revocación."], "c": 0, "w": "Art. 6.6: los poderes inscritos tendrán una validez determinada máxima de cinco años a contar desde la fecha de inscripción."}, {"d": "Difícil", "q": "En relación con la revocación y prórroga de los poderes inscritos en el registro, señale la respuesta correcta:", "o": ["La prórroga solo puede solicitarse una vez vencido el plazo de validez del poder.", "La revocación del poder requiere la conformidad del apoderado.", "En cualquier momento antes de la finalización del plazo, el poderdante podrá revocar o prorrogar el poder; las prórrogas tienen una validez determinada máxima de cinco años desde la fecha de inscripción.", "Los poderes solo pueden prorrogarse una vez y por un máximo de dos años."], "c": 2, "w": "Art. 6.6: en cualquier momento antes de que finalice el plazo, el poderdante podrá revocar o prorrogar el poder; las prórrogas tendrán una validez determinada máxima de cinco años a contar desde la fecha de inscripción."}, {"d": "Difícil", "q": "Las solicitudes de inscripción, revocación, prórroga o denuncia de un poder:", "o": ["Deben presentarse ante notario, que las comunicará al registro competente.", "Surten efectos desde la fecha de presentación en cualquier registro.", "Podrán dirigirse a cualquier registro, debiendo quedar inscritas en el registro de la Administración u Organismo ante la que tenga efectos el poder, y surten efectos desde la fecha de dicha inscripción.", "Solo pueden presentarse en el registro de la Administración ante la que tenga efectos el poder."], "c": 2, "w": "Art. 6.7: pueden dirigirse a cualquier registro, debiendo quedar inscritas en el registro de la Administración u Organismo ante la que tenga efectos el poder, y surten efectos desde la fecha en que se produzca dicha inscripción."}, {"d": "Fácil", "q": "Cuando en una solicitud figuren varios interesados, las actuaciones a que dé lugar se efectuarán:", "o": ["Con el interesado de mayor edad, salvo que se haya designado representante.", "Con el interesado que elija el órgano instructor.", "Con todos los interesados por separado, en todo caso.", "Con el representante o el interesado que expresamente hayan señalado y, en su defecto, con el que figure en primer término."], "c": 3, "w": "Art. 7: las actuaciones se efectuarán con el representante o el interesado que expresamente hayan señalado y, en su defecto, con el que figure en primer término."}, {"d": "Medio", "q": "Si durante la instrucción de un procedimiento que no haya tenido publicidad se advierte la existencia de titulares de derechos o intereses legítimos y directos, cuya identificación resulte del expediente y que puedan resultar afectados por la resolución:", "o": ["Se publicará un anuncio en el Boletín Oficial del Estado.", "Se archivará el procedimiento y se iniciará uno nuevo con todos los interesados.", "Se comunicará a dichas personas la tramitación del procedimiento.", "Se suspenderá el procedimiento hasta que esas personas se personen."], "c": 2, "w": "Art. 8: en ese supuesto «se comunicará a dichas personas la tramitación del procedimiento»."}, {"d": "Medio", "q": "Las Administraciones Públicas verifican la identidad de los interesados mediante la comprobación de:", "o": ["Su nombre y apellidos o denominación o razón social, según corresponda, que consten en el DNI o documento identificativo equivalente.", "Su firma manuscrita, cotejada con la que conste en el registro de apoderamientos.", "Su domicilio y número de teléfono, que consten en el padrón municipal.", "Su número de afiliación a la Seguridad Social."], "c": 0, "w": "Art. 9.1: las Administraciones están obligadas a verificar la identidad de los interesados comprobando su nombre y apellidos o denominación o razón social que consten en el DNI o documento identificativo equivalente."}, {"d": "Difícil", "q": "De forma previa a la eficacia jurídica de un sistema de identificación de los previstos en el artículo 9.2.c) deben transcurrir:", "o": ["Dos meses desde la comunicación a la Secretaría General de Administración Digital.", "Un mes desde su publicación en el Boletín Oficial del Estado.", "Diez días desde la emisión del informe de la Secretaría de Estado de Seguridad.", "Tres meses desde su autorización por el Consejo de Ministros."], "c": 0, "w": "Art. 9.2.c): deben transcurrir dos meses desde la comunicación, durante los cuales el órgano estatal competente puede acudir a la vía jurisdiccional por motivos de seguridad pública, previo informe vinculante de la Secretaría de Estado de Seguridad, que se emite en diez días."}, {"d": "Medio", "q": "En materia de sistemas de identificación electrónica, las Administraciones Públicas deberán garantizar que:", "o": ["La utilización de los sistemas basados en certificados cualificados de firma o de sello electrónico sea posible para todo procedimiento, aun cuando se admita otro sistema de la letra c).", "Los sistemas de la letra c) sean utilizables únicamente ante la Administración General del Estado.", "Solo se admitan certificados de firma electrónica, nunca de sello electrónico.", "Si se admite un sistema de la letra c), puedan excluirse los basados en certificados electrónicos cualificados."], "c": 0, "w": "Art. 9.2, último párrafo: las Administraciones deberán garantizar que la utilización de uno de los sistemas de las letras a) y b) sea posible para todo procedimiento, aun cuando se admita para ese mismo procedimiento alguno de la letra c)."}, {"d": "Difícil", "q": "Los recursos técnicos necesarios para la recogida, almacenamiento, tratamiento y gestión de los sistemas de identificación del artículo 9.2.c) deberán estar situados:", "o": ["En cualquier país del Espacio Económico Europeo, sin distinción por tipo de datos.", "En territorio de la Unión Europea y, si se trata de categorías especiales de datos del art. 9 del RGPD, en territorio español.", "En el lugar que decida libremente el prestador, siempre que esté certificado.", "En territorio español en todo caso."], "c": 1, "w": "Art. 9.3: los recursos técnicos deben estar en territorio de la Unión Europea y, en el caso de categorías especiales de datos del art. 9 del Reglamento (UE) 2016/679, en territorio español."}, {"d": "Medio", "q": "La aceptación de alguno de los sistemas de identificación por la Administración General del Estado:", "o": ["Acredita la identificación de forma absoluta, sin admitir prueba en contrario.", "Solo surte efectos frente a la propia Administración General del Estado.", "Servirá para acreditar frente a todas las Administraciones Públicas, salvo prueba en contrario, la identificación electrónica de los interesados.", "Debe ser ratificada por cada Comunidad Autónoma para tener efectos en su territorio."], "c": 2, "w": "Art. 9.4: la aceptación de alguno de estos sistemas por la AGE servirá para acreditar frente a todas las Administraciones Públicas, salvo prueba en contrario, la identificación electrónica de los interesados."}, {"d": "Medio", "q": "Según el artículo 10.1, los interesados podrán firmar a través de cualquier medio que permita acreditar:", "o": ["La autenticidad de la expresión de su voluntad y consentimiento, así como la integridad e inalterabilidad del documento.", "Únicamente su identidad mediante el DNI electrónico.", "La representación con la que actúan ante la Administración.", "La fecha y la hora de presentación del documento en el registro."], "c": 0, "w": "Art. 10.1: los interesados podrán firmar a través de cualquier medio que permita acreditar la autenticidad de la expresión de su voluntad y consentimiento, así como la integridad e inalterabilidad del documento."}, {"d": "Medio", "q": "Cuando los interesados utilicen un sistema de firma de los previstos en el artículo 10:", "o": ["Deberán acreditar además su identidad mediante un sistema de identificación distinto.", "Su identidad se entenderá ya acreditada mediante el propio acto de la firma.", "Deberán aportar copia del DNI junto con el documento firmado.", "La firma solo será válida si la ratifican presencialmente en una oficina de registro."], "c": 1, "w": "Art. 10.5: cuando los interesados utilicen un sistema de firma de los previstos en este artículo, su identidad se entenderá ya acreditada mediante el propio acto de la firma."}, {"d": "Difícil", "q": "Con carácter general basta con que el interesado acredite su identidad para realizar cualquier actuación. Las Administraciones solo podrán exigir el uso obligatorio de firma para:", "o": ["Formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos.", "Interponer recursos y solicitar copias auténticas de documentos del expediente.", "Formular solicitudes, presentar alegaciones, aportar documentos e interponer recursos.", "Cualquier actuación que se realice por medios electrónicos."], "c": 0, "w": "Art. 11: con carácter general basta acreditar la identidad (apdo. 1); la firma solo es obligatoria para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos (apdo. 2). Son los mismos supuestos en que el art. 5.3 exige acreditar la representación."}, {"d": "Difícil", "q": "Si un interesado no obligado a relacionarse electrónicamente carece de los medios electrónicos necesarios, su identificación o firma electrónica podrá ser realizada por un funcionario público. Para ello es necesario que:", "o": ["El interesado se identifique ante el funcionario y preste su consentimiento expreso, quedando constancia para los casos de discrepancia o litigio.", "El funcionario esté inscrito en el registro electrónico de apoderamientos como representante del interesado.", "El interesado otorgue poder notarial a favor del funcionario.", "El interesado presente una declaración responsable de no disponer de medios electrónicos."], "c": 0, "w": "Art. 12.2: el funcionario puede realizarla con su propio sistema de firma; es necesario que el interesado se identifique ante él y preste su consentimiento expreso, de lo que debe quedar constancia para casos de discrepancia o litigio."}, {"d": "Medio", "q": "En el registro, u otro sistema equivalente, de funcionarios habilitados para la identificación o firma de los interesados deberán constar, al menos:", "o": ["Todos los funcionarios del grupo A1 de cada Administración.", "Los funcionarios que presten servicios en las oficinas de asistencia en materia de registros.", "Los secretarios de los órganos colegiados.", "Los funcionarios que ejerzan funciones de instrucción de procedimientos sancionadores."], "c": 1, "w": "Art. 12.3: la AGE, las CCAA y las Entidades Locales mantendrán actualizado un registro o sistema equivalente, interoperable, de funcionarios habilitados; en él constarán, al menos, los que presten servicios en las oficinas de asistencia en materia de registros."}];

const L = "abcd";
let i = 0, hits = 0, answered = false, fails = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const it = DATA[i];
  answered = false;
  document.getElementById("cnt").textContent = (i+1)+" / "+DATA.length;
  document.getElementById("barfill").style.width = (i/DATA.length*100)+"%";
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  let h = '<div class="qhead"><span>Pregunta '+(i+1)+'</span><span class="tag">'+it.d+'</span></div>';
  h += '<p class="q">'+esc(it.q)+'</p>';
  it.o.forEach((o,k)=>{ h += '<button class="opt" data-k="'+k+'" onclick="pick('+k+')"><b>'+L[k]+')</b><span>'+esc(o)+'</span></button>'; });
  h += '<div class="why" id="why"></div>';
  h += '<div class="actions"><button class="btn" id="next" disabled onclick="next()">'+(i<DATA.length-1?"Siguiente":"Ver resultado")+'</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function pick(k){
  if(answered) return; answered = true;
  const it = DATA[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  btns[it.c].classList.add("ok");
  const why = document.getElementById("why");
  if(k===it.c){ hits++; why.className="why ok"; why.innerHTML="<b>Correcto.</b> "+esc(it.w); }
  else { btns[k].classList.add("ko"); fails.push(i); why.className="why ko"; why.innerHTML="<b>Incorrecto. La respuesta correcta es la "+L[it.c]+").</b> "+esc(it.w); }
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  document.getElementById("next").disabled = false;
}

function next(){ if(i<DATA.length-1){ i++; render(); } else finish(); }

function finish(){
  document.getElementById("barfill").style.width = "100%";
  const nota = (hits/DATA.length*10).toFixed(2).replace(".",",");
  const msg = hits>=Math.ceil(DATA.length*0.85) ? "Excelente. Dominas el tema." : hits>=Math.ceil(DATA.length*0.5) ? "Aprobado. Repasa las preguntas falladas." : "Necesitas repasar el tema.";
  let h = '<div class="result"><p style="margin:0;color:var(--gris)">Resultado</p><div class="big">'+nota+'</div>';
  h += '<p><b>'+hits+'</b> aciertos de '+DATA.length+'. '+msg+'</p></div>';
  if(fails.length){
    h += '<div class="result"><p style="text-align:left;font-weight:bold;margin-top:18px">Preguntas falladas</p><ul>';
    fails.forEach(f=>{ const it=DATA[f]; h += '<li><b>'+(f+1)+'.</b> '+esc(it.q)+'<br><span style="color:var(--ok)">Correcta: '+L[it.c]+') '+esc(it.o[it.c])+'</span></li>'; });
    h += '</ul></div>';
  }
  h += '<div class="actions" style="justify-content:center"><button class="btn" onclick="restart()">Repetir el test</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function restart(){ i=0; hits=0; fails=[]; render(); }

/* ---- Acceso docente ---- */
function toggleLock(){ const l=document.getElementById("lock"); l.style.display = l.style.display==="block"?"none":"block"; if(l.style.display==="block") document.getElementById("pw").focus(); }
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(){
  const msg = document.getElementById("lockmsg"); msg.textContent = "";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.s), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c));
    document.getElementById("wordbody").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("pw").value = "";
    document.getElementById("lock").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("foot").style.display = "none";
    document.getElementById("word").style.display = "block";
    window.scrollTo(0,0);
  }catch(e){ msg.textContent = "Contraseña incorrecta."; }
}
function closeWord(){
  document.getElementById("wordbody").innerHTML = "";
  document.getElementById("word").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("foot").style.display = "block";
}
async function copyWord(){
  const body = document.getElementById("wordbody"), m = document.getElementById("copymsg");
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([body.innerHTML],{type:"text/html"}),"text/plain":new Blob([body.innerText],{type:"text/plain"})})]);
    m.textContent = "Copiado. Pégalo en Word.";
  }catch(e){
    const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ document.execCommand("copy"); m.textContent = "Copiado. Pégalo en Word."; }catch(e2){ m.textContent = "Selecciona el texto y copia con Ctrl+C."; }
    s.removeAllRanges();
  }
}
function downloadDoc(){
  const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:11pt}</style></head><body>'+document.getElementById("wordbody").innerHTML+'</body></html>';
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿",doc],{type:"application/msword"}));
  a.download = "Test_Ley39_2015_TPreliminar_TI.doc"; document.body.appendChild(a); a.click(); a.remove();
}
